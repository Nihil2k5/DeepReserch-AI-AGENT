[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Durable multi-agent web research pipeline with citations, tracing and evals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
]

[project.optional-dependencies]
observability = ["langfuse>=2.50"]
browser = ["playwright>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
research = "deep_research.cli:main"
research-worker = "deep_research.worker:main"
research-eval = "deep_research.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: requires Postgres/Redis and real API keys",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # FastAPI dependency-injection idiom.
    "B008",
    # Intentional no-op hooks on ABCs.
    "B027",
]
